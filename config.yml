# url_prefix: "/oidc"

authorization_endpoint: ""
token_endpoint: ""
userinfo_endpoint: ""
end_session_endpoint: ""

client_id: ""
client_secret: ""

# Scopes requested at login. Add offline_access (refresh token) and the
# middle-tier ".default" scope when the platform needs to act on the user's behalf.
# scope: "openid profile email"

# ID token verification. Keys come from the first of these that is set:
#   jwt_public_key  - PEM public key
#   jwks_uri        - JWKS document URL
#   issuer          - discovery: {issuer}/.well-known/openid-configuration
#   metadata_endpoint - discovery from that URL; the document's issuer is adopted
#                     and enforced on the token (set issuer too to pin it)
# audience is always client_id; when issuer is set the token's iss must equal it.
# issuer: ""
# jwks_uri: ""
# jwt_public_key: ""
# leeway: 60  # seconds of clock skew tolerated on exp/nbf/iat

# Which ID token claims carry the tenant and the subject of the user's immutable
# identity (issuer, tid, oid). Defaults are the Entra claims. A generic issuer such as
# Keycloak has no tenant claim: set tid to null, take the subject from "sub", and give
# the realm a fixed tenant GUID (the same value as pylon_main's identity_verifier
# tenant_id). The plugin refuses to start with a mapping that cannot form an identity.
# subject_claims: {tid: tid, oid: oid}
# subject_tenant: ""

# With none of the three above the plugin refuses to start. This opts in to
# accepting unsigned ID tokens (insecure; logs an ERROR at start and at every login).
# allow_unverified_id_token: false

# On-behalf-of custody (C-1009 #6756 step 4). When on, a Microsoft (Entra v2) sign-in is also kept under the person's
# subject in the session Redis, so a credential release can exchange it on their behalf while they are signed in
# (elitea_core asks for it over RPC auth_oidc_obo_assertion). The scope above must then ask for the platform API's
# access_as_user scope and offline_access. Logout drops it.
# Each request is signed with a key shared with elitea_core only (32+ characters, from the environment variable named
# here; give it to pylon_auth and pylon_main only, never through an env file every pylon loads). obo_api_client_id is
# the platform API's client id: only a sign-in token for it is kept. Missing key or id: nothing is kept (ERROR at init).
# Custody lives as long as the session does.
# obo_custody_enabled: false
# obo_api_client_id: <platform API client id>
# obo_custody_key_env: ELITEA_OBO_CUSTODY_KEY
# obo_custody_prefix: c1009_obo_custody:
